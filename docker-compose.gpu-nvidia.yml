# Backward-compatible NVIDIA override filename.
#
# This file is intentionally a thin overlay. Always combine it with the base:
#   docker compose -f docker-compose.yml \
#     -f docker-compose.gpu-nvidia.yml up -d --build
#
# The base file remains the single source of truth for Bun/Camofox, storage,
# telemetry, authentication, and bundled services. The canonical equivalent is
# docker/gpu.nvidia.yml.
services:
  odysseus:
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
